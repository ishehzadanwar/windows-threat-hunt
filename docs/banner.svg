<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1712"/>
      <stop offset="1" stop-color="#100c08"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c46b"/>
      <stop offset="1" stop-color="#d98f2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0a23b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e0a23b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="1010" cy="70" r="240" fill="url(#glow)"/>
  <circle cx="150" cy="300" r="200" fill="url(#glow)"/>

  <g stroke="#f6efe1" stroke-opacity="0.035">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <rect x="0" y="0" width="9" height="300" fill="url(#amber)"/>

  <!-- magnifying glass emblem -->
  <g transform="translate(74,84)" fill="none" stroke="url(#amber)" stroke-width="6" stroke-linecap="round">
    <circle cx="56" cy="56" r="40"/>
    <line x1="86" y1="86" x2="120" y2="120"/>
    <circle cx="56" cy="56" r="12" fill="url(#amber)" stroke="none"/>
  </g>

  <text x="228" y="126" fill="#f6efe1" font-size="54" font-weight="700" letter-spacing="1">Windows Threat Hunt</text>
  <rect x="230" y="146" width="150" height="4" rx="2" fill="url(#amber)"/>
  <text x="230" y="190" fill="#c9b79c" font-size="23">Hypothesis-driven hunting · Sysmon · Windows Event Logs · Wazuh</text>
  <text x="230" y="222" fill="#8f8171" font-size="19" letter-spacing="0.5">Go looking for the attacker the alerts missed</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="15">
    <g transform="translate(230,248)">
      <rect width="176" height="34" rx="17" fill="#241d16" stroke="#3a2f24"/>
      <circle cx="20" cy="17" r="5" fill="#6cc08b"/>
      <text x="36" y="22" fill="#d9c7ac">3 hunts run</text>
    </g>
    <g transform="translate(420,248)">
      <rect width="270" height="34" rx="17" fill="#241d16" stroke="#3a2f24"/>
      <circle cx="20" cy="17" r="5" fill="#e0a23b"/>
      <text x="36" y="22" fill="#d9c7ac">execution · credentials · persistence</text>
    </g>
  </g>
</svg>
